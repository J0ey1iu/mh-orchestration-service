[project]
name = "mh-orchestration-service"
version = "0.1.2a14"
description = "Orchestration Gateway — loads scenarios, routes agents, streams events. Built on top of minimal-harness."
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20.0",
    "async-gaussdb>=0.30.4",
    "fastapi>=0.115.0",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.30.0",

    "pydantic-settings>=2.0",
    "minimal-harness>=0.6.2a16",
]

[build-system]
requires = ["uv_build>=0.10.12,<0.12"]
build-backend = "uv_build"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mh_orchestration_service = ["py.typed", "static/**"]

[tool.uv.sources]
minimal-harness = { workspace = true }

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
